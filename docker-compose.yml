# Fulfillment CRM / WMS — отдельный проект.
# Не пересекается с wb-chz (/opt/wb-chz, порт 8000) и darom (/opt/darom_app).
name: fulfillment

services:
  db:
    image: postgres:16-alpine
    container_name: fulfillment_db
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfillment}
    volumes:
      - fulfillment_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fulfillment_redis
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - fulfillment_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fulfillment_web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fulfillment:${POSTGRES_PASSWORD:-fulfillment}@db:5432/fulfillment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DEBUG: ${DEBUG:-false}
    ports:
      # wb-chz занимает 8000 — этот проект на 8001
      - "127.0.0.1:8001:8000"
    volumes:
      - fulfillment_media:/app/media
      - fulfillment_static:/app/staticfiles
      - fulfillment_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fulfillment_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fulfillment:${POSTGRES_PASSWORD:-fulfillment}@db:5432/fulfillment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
    volumes:
      - fulfillment_media:/app/media
      - fulfillment_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fulfillment_beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fulfillment:${POSTGRES_PASSWORD:-fulfillment}@db:5432/fulfillment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
    volumes:
      - fulfillment_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    restart: unless-stopped

volumes:
  fulfillment_pgdata:
  fulfillment_redis_data:
  fulfillment_media:
  fulfillment_static:
  fulfillment_logs:
