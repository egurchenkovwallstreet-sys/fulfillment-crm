<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Макет листа подбора — 25 строк</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #cbd5e1;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
    }

    .hint {
      max-width: 560px;
      text-align: center;
      font-size: 13px;
      color: #475569;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: center;
      font-size: 13px;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls input {
      padding: 4px 8px;
      font-size: 14px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }

    .variant-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .variant-label {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
    }

    /* A4 книжная — ровно 25 строк */
    .sheet {
      width: 210mm;
      height: 297mm;
      background: #fff;
      color: #0f172a;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.18);
      padding: 8mm 10mm 6mm;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .sheet-header {
      border-bottom: 1.5px solid #0f172a;
      padding-bottom: 3mm;
      margin-bottom: 2mm;
    }

    .seller-name {
      font-size: 14pt;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 2mm;
    }

    .sheet-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 3mm 10mm;
      font-size: 10pt;
      font-weight: 400;
      color: #334155;
    }

    .sheet-meta strong {
      font-weight: 400;
      color: #0f172a;
    }

    .pick-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      height: 100%;
    }

    .pick-table thead th {
      text-align: left;
      font-size: 7pt;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      padding: 0 1.5mm 1.5mm;
      border-bottom: 1px solid #cbd5e1;
      vertical-align: bottom;
      height: 5mm;
    }

    .pick-table tbody tr {
      border-bottom: 1px solid #e2e8f0;
      height: calc((297mm - 8mm - 6mm - 14mm - 5mm) / 25);
    }

    .pick-table tbody tr:last-child {
      border-bottom: none;
    }

    .pick-table td {
      padding: 0 1.5mm;
      vertical-align: middle;
      overflow: hidden;
    }

    .col-cell { width: 11%; }
    .col-qty { width: 8%; text-align: center; }
    .col-barcode { width: 24%; }
    .col-name { width: 45%; }
    .col-check { width: 12%; text-align: center; }

    /* Единый шрифт в колонках; номер ячейки — жирнее и крупнее */
    .row-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11pt;
      font-weight: 400;
      line-height: 1;
      word-break: break-word;
    }

    .row-text--cell {
      font-size: 14pt;
      font-weight: 700;
      line-height: 1;
    }

    .check-box {
      display: inline-block;
      width: 7mm;
      height: 7mm;
      border: 1.5px solid #0f172a;
      border-radius: 0.8mm;
      vertical-align: middle;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .page-title,
      .hint,
      .controls,
      .variant-label {
        display: none;
      }

      .sheet {
        box-shadow: none;
        width: 100%;
        height: 297mm;
        page-break-after: always;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">Макет листа подбора</h1>
  <p class="hint">
    A4, книжная ориентация, <strong>25 строк</strong> на листе.
    Ячейка, кол-во, баркод и название — <strong>11pt</strong>, межстрочный интервал минимальный.
    Номер ячейки — <strong>14pt жирный</strong>.
  </p>

  <div class="controls">
    <label>ИП: <input id="seller" value="ИП Мазирка" /></label>
    <label>Дата: <input id="date" value="22.08.2026" /></label>
    <label>Заказов: <input id="orders" type="number" value="38" /></label>
    <label>№ листа: <input id="listId" type="number" value="12" /></label>
  </div>

  <div id="sheet-root"></div>

  <script>
    const SAMPLE = [
      { cell: 2, qty: 1, barcode: '2042493787134', name: 'Кардиган для девочки на пуговицах с цветами' },
      { cell: 3, qty: 1, barcode: '2054638604244', name: 'Костюм школьный твидовый с юбкой для девочки' },
      { cell: 4, qty: 2, barcode: '2041336069369', name: 'Пижама хлопковая детская со штанами' },
      { cell: 5, qty: 1, barcode: '2041336123456', name: 'Футболка хлопковая детская с принтом' },
      { cell: 6, qty: 3, barcode: '2041336234567', name: 'Шорты детские хлопковые' },
      { cell: 7, qty: 1, barcode: '2041336345678', name: 'Платье летнее для девочки' },
      { cell: 8, qty: 2, barcode: '2041336456789', name: 'Брюки школьные для мальчика' },
      { cell: 9, qty: 1, barcode: '2041336567890', name: 'Свитшот детский с капюшоном' },
      { cell: 10, qty: 4, barcode: '2041336678901', name: 'Пижама хлопковая детская со штанами' },
      { cell: 11, qty: 2, barcode: '2041336192417', name: 'Пижама хлопковая детская со штанами' },
      { cell: 12, qty: 1, barcode: '2041336535841', name: 'Пижама хлопковая детская со штанами' },
      { cell: 13, qty: 3, barcode: '2041336535842', name: 'Пижама хлопковая детская со штанами' },
      { cell: 14, qty: 1, barcode: '2041336535843', name: 'Костюм спортивный детский' },
      { cell: 15, qty: 2, barcode: '2041336535844', name: 'Куртка демисезонная детская' },
      { cell: 16, qty: 1, barcode: '2041336535845', name: 'Джинсы детские прямые' },
      { cell: 17, qty: 2, barcode: '2041336535846', name: 'Рубашка школьная белая' },
      { cell: 18, qty: 1, barcode: '2041336535847', name: 'Толстовка детская на молнии' },
      { cell: 19, qty: 3, barcode: '2041336535848', name: 'Комплект белья детский хлопок' },
      { cell: 20, qty: 1, barcode: '2041336535849', name: 'Ветровка детская лёгкая' },
      { cell: 21, qty: 2, barcode: '2041336535850', name: 'Юбка школьная серая' },
      { cell: 22, qty: 1, barcode: '2041336535851', name: 'Жилет утеплённый детский' },
      { cell: 23, qty: 2, barcode: '2041336535852', name: 'Легинсы детские хлопковые' },
      { cell: 24, qty: 1, barcode: '2041336535853', name: 'Пolo детская с воротником' },
      { cell: 25, qty: 3, barcode: '2041336535854', name: 'Комбинезон детский тёплый' },
    ];

    function rowHtml(item) {
      return `
        <tr>
          <td class="col-cell"><div class="row-text row-text--cell">${item.cell}</div></td>
          <td class="col-qty"><div class="row-text">${item.qty}</div></td>
          <td class="col-barcode"><div class="row-text">${item.barcode}</div></td>
          <td class="col-name"><div class="row-text">${item.name}</div></td>
          <td class="col-check"><span class="check-box" aria-label="Отметка"></span></td>
        </tr>`;
    }

    function render() {
      const seller = document.getElementById('seller').value || '—';
      const date = document.getElementById('date').value || '—';
      const orders = document.getElementById('orders').value || '0';
      const listId = document.getElementById('listId').value || '—';

      document.getElementById('sheet-root').innerHTML = `
        <div class="variant-wrap">
          <div class="variant-label">25 строк на листе A4</div>
          <article class="sheet">
            <header class="sheet-header">
              <div class="seller-name">${seller}</div>
              <div class="sheet-meta">
                <span>Лист подбора № <strong>${listId}</strong></span>
                <span>Дата: <strong>${date}</strong></span>
                <span>Заказов: <strong>${orders}</strong></span>
              </div>
            </header>
            <table class="pick-table">
              <thead>
                <tr>
                  <th class="col-cell">Ячейка</th>
                  <th class="col-qty">Кол-во</th>
                  <th class="col-barcode">Баркод</th>
                  <th class="col-name">Название</th>
                  <th class="col-check">Собрано</th>
                </tr>
              </thead>
              <tbody>${SAMPLE.map(rowHtml).join('')}</tbody>
            </table>
          </article>
        </div>`;
    }

    ['seller', 'date', 'orders', 'listId'].forEach((id) => {
      document.getElementById(id).addEventListener('input', render);
    });

    render();
  </script>
</body>
</html>
