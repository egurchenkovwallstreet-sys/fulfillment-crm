<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Макет этикетки ячейки — 60% номер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #e8e8e8;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .hint {
      font-size: 13px;
      color: #666;
      max-width: 320px;
      text-align: center;
      line-height: 1.4;
    }

    /* Этикетка 75×120 мм, книжная ориентация: 20% / 60% / 20% */
    .label {
      width: 75mm;
      height: 120mm;
      background: #fff;
      border: 1px solid #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    .zone-top {
      flex: 0 0 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4mm;
      border-bottom: 1px dashed #ccc;
    }

    .zone-top .seller {
      font-size: 11pt;
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
      word-break: break-word;
    }

    .zone-middle {
      flex: 0 0 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fafafa;
    }

    .zone-middle .cell-number {
      font-weight: 900;
      line-height: 0.85;
      text-align: center;
      /* Номер масштабируется под 60% зоны */
      font-size: 63mm;
      letter-spacing: -0.02em;
    }

    .zone-bottom {
      flex: 0 0 20%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 3mm;
      border-top: 1px dashed #ccc;
      gap: 1mm;
    }

    .barcode-bars {
      width: 100%;
      max-width: 48mm;
      height: 8mm;
      background: repeating-linear-gradient(
        90deg,
        #000 0,
        #000 1.2mm,
        #fff 1.2mm,
        #fff 2mm
      );
    }

    .barcode-text {
      font-size: 5.5mm;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls input {
      width: 64px;
      padding: 4px 8px;
      font-size: 14px;
    }

    @media print {
      body { background: #fff; }
      h1, .hint, .controls { display: none; }
      .label { box-shadow: none; }
    }
  </style>
</head>
<body>
  <h1>Макет этикетки ячейки</h1>
  <p class="hint">
    Номер ячейки — ровно <strong>60%</strong> высоты этикетки (зона по центру).
    ИП и баркод — по <strong>20%</strong> каждый.
  </p>

  <div class="controls">
    <label>ИП: <input id="seller" value="ИП Мазирка В. Е." /></label>
    <label>Ячейка: <input id="cell" value="12" /></label>
    <label>Баркод: <input id="barcode" value="4601234567890" /></label>
  </div>

  <article class="label" id="label">
    <header class="zone-top">
      <div class="seller" id="sellerText">ИП Мазирка В. Е.</div>
    </header>
    <main class="zone-middle">
      <div class="cell-number" id="cellText">12</div>
    </main>
    <footer class="zone-bottom">
      <div class="barcode-bars" aria-hidden="true"></div>
      <div class="barcode-text" id="barcodeText">4601234567890</div>
    </footer>
  </article>

  <script>
    const sellerInput = document.getElementById('seller');
    const cellInput = document.getElementById('cell');
    const barcodeInput = document.getElementById('barcode');
    const sellerText = document.getElementById('sellerText');
    const cellText = document.getElementById('cellText');
    const barcodeText = document.getElementById('barcodeText');

    function fitCellNumber() {
      const zone = document.querySelector('.zone-middle');
      const el = document.getElementById('cellText');
      const maxW = zone.clientWidth * 0.92;
      const maxH = zone.clientHeight * 0.92;
      let size = maxH;
      el.style.fontSize = size + 'px';
      while ((el.scrollWidth > maxW || el.scrollHeight > maxH) && size > 8) {
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }

    function update() {
      sellerText.textContent = sellerInput.value || '—';
      cellText.textContent = cellInput.value || '—';
      barcodeText.textContent = barcodeInput.value || '—';
      fitCellNumber();
    }

    [sellerInput, cellInput, barcodeInput].forEach((el) => {
      el.addEventListener('input', update);
    });

    window.addEventListener('resize', fitCellNumber);
    update();
  </script>
</body>
</html>
