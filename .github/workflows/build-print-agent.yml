name: Build Print Agent

on:
  push:
    branches: [main]
    paths:
      - 'print-bridge/**'
      - '.github/workflows/build-print-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            print-bridge/requirements.txt
            print-bridge/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Create icon
        run: python create_icon.py

      - name: Build portable folder (recommended for old PCs)
        run: pyinstaller build.spec --noconfirm --clean

      - name: Build one-file (optional)
        run: pyinstaller build-onefile.spec --noconfirm --clean

      - name: Package zip
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/FulfillmentCRM-PrintAgent/FulfillmentCRM-PrintAgent.exe")) {
            throw "Portable exe not found"
          }
          Compress-Archive -Path "dist/FulfillmentCRM-PrintAgent" -DestinationPath "dist/FulfillmentCRM-PrintAgent-portable.zip" -Force
          $folderSize = (Get-ChildItem "dist/FulfillmentCRM-PrintAgent" -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Portable folder size: $folderSize bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FulfillmentCRM-PrintAgent
          path: |
            print-bridge/dist/FulfillmentCRM-PrintAgent-portable.zip
            print-bridge/dist/FulfillmentCRM-PrintAgent-onefile.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view print-agent 2>/dev/null || gh release create print-agent \
            --title "Fulfillment CRM — Агент печати" \
            --notes "Portable zip — для старых ПК. Onefile — один exe, первый запуск медленнее."
          gh release upload print-agent dist/FulfillmentCRM-PrintAgent-portable.zip --clobber
          gh release upload print-agent dist/FulfillmentCRM-PrintAgent-onefile.exe --clobber
